<mat-card class="produto">
  <mat-card-header>
    <mat-card-title>{{ nome }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p>{{ preco | currency: 'BRL' }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-stroked-button (click)="selecionarProduto()">
      Selecionar {{ nome }}
    </button>
  </mat-card-actions>
</mat-card>
